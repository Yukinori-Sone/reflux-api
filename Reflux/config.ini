[Update]
updateFiles = true
updateserver = "https://raw.githubusercontent.com/olji/Reflux/master/Reflux/"

[Record]
; Custom branch defaults: only tracker.db / bestdetail.json / plays.jsonl / sessions are written, clients read the rest from the API
saveremote = false
savelocal = true
savejson = false
savelatestjson = false
savelatesttxt = false

[RemoteRecord]
serverAddress = "https://server.here"
apikey = "apikey"

[LocalRecord]
songinfo = true
chartdetails = true
resultdetails = true
judge = true
settings = true
uselocaltime = false

[Livestream]
; Files for stream overlays (playstate.txt, marquee.txt, title.txt ...). Upstream default: true
showplaystate = false
enablemarquee = false
enablefullsonginfo = false
marqueeidletext = Beatmania IIDX Infinitas

[Debug]
outputdb = false

[Api]
; HTTP API for remote clients (Beat Ledger and others). host = + listens on all interfaces (needs netsh urlacl)
enabled = true
host = localhost
port = 8790
apikey = 
